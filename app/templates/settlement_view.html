<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>보스 정산 현황</title>
  <style>
    body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f5f7fb; margin:0; padding:16px; }
    .card { max-width:640px; margin:0 auto; background:white; border-radius:12px; padding:20px; box-shadow:0 6px 24px rgba(0,0,0,0.08); }
    h1 { margin:0 0 12px; font-size:22px; }
    .row { margin:8px 0; color:#222; }
    .muted { color:#666; }
    ul { margin:8px 0; padding-left:20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{boss_name}} 정산</h1>
    <div class="row"><b>상태:</b> {{status}}</div>
    <div class="row"><b>총 금액:</b> {{total}}</div>
    <div class="row"><b>분배 인원:</b> {{member_count}}명</div>
    <div class="row"><b>1인당:</b> {{per_member}}</div>
    <div class="row"><b>생성:</b> {{created_at}}</div>
    <div class="row"><b>완료:</b> {{completed_at}}</div>
    <div class="row"><b>드랍:</b></div>
    <ul>
      {{drop_items}}
    </ul>
    <p class="muted">이 페이지는 조회 전용입니다. 명령은 카카오톡에서 실행하세요.</p>
  </div>
</body>
</html>
